name: Reproduce from original observations

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check failure handling
        run: python -m unittest discover -s tests -v
      - name: Reproduce the analysis with the documented command
        run: python reproduce.py
      - name: Save calculations, plots and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: results-${{ matrix.os }}
          path: |
            results/SUMMARY.md
            results/verification.json
            results/measurements.json
            results/figures/
            results/logs/
          if-no-files-found: warn
          retention-days: 30
